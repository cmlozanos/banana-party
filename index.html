<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="application-version" content="2.0.0">
    <meta name="theme-color" content="#87ceeb">
    <link rel="manifest" href="manifest.webmanifest">

    <script defer src="game.bundle.js?v=2.0.0" onerror="document.getElementById('load-error').hidden=false"></script>

</html>
